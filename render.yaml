services:
  # ReachInbox Express Backend API & BullMQ Workers on Render
  - type: web
    name: reachinbox-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set to your Aiven MySQL URI in Render dashboard
      - key: REDIS_URL
        sync: false # Set to your Aiven Redis URI in Render dashboard
      - key: FRONTEND_URL
        sync: false # Set to your Vercel URL (https://your-app.vercel.app)
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 200
